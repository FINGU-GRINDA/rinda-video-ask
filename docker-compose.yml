# ===========================================
# Rinda Video Ask - Docker Compose
# For local development and testing
# ===========================================

version: '3.8'

services:
  # -------------------------------------------
  # Studio Dashboard (Next.js)
  # -------------------------------------------
  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Server-side only env vars (not baked into build)
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RINDA_API_KEY=${RINDA_API_KEY}
      - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - KAKAO_WORK_WEBHOOK_URL=${KAKAO_WORK_WEBHOOK_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

# -------------------------------------------
# Networks
# -------------------------------------------
networks:
  default:
    name: rinda-network

# -------------------------------------------
# Usage:
# -------------------------------------------
# 1. Copy .env.example to .env and fill in values
# 2. Build: docker-compose build
# 3. Run: docker-compose up -d
# 4. View logs: docker-compose logs -f studio
# 5. Stop: docker-compose down
